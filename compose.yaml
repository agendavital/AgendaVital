name: agendavital

services:
  database:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: Developer
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:?Configura MSSQL_SA_PASSWORD en .env.docker}
    ports:
      - "1433:1433"
    volumes:
      - sqlserver_data:/var/opt/mssql
    healthcheck:
      test:
        - CMD-SHELL
        - /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "$${MSSQL_SA_PASSWORD}" -C -Q "SELECT 1" || exit 1
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    restart: unless-stopped

  database-init:
    build:
      context: ./backend
      target: builder
    command:
      - sh
      - -c
      - node docker/create-database.cjs && npx prisma db push && node docker/seed.cjs
    environment:
      DATABASE_URL: sqlserver://database:1433;database=AgendaVital;user=sa;password=${MSSQL_SA_PASSWORD};encrypt=true;trustServerCertificate=true
      DB_SERVER: database
      DB_PORT: 1433
      DB_DATABASE: AgendaVital
      DB_USER: sa
      DB_PASSWORD: ${MSSQL_SA_PASSWORD}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@agendavital.local}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Configura ADMIN_PASSWORD en .env.docker}
    depends_on:
      database:
        condition: service_healthy
    restart: "no"

  backend:
    build:
      context: ./backend
      target: runtime
    environment:
      DB_SERVER: database
      DB_PORT: 1433
      DB_DATABASE: AgendaVital
      DB_USER: sa
      DB_PASSWORD: ${MSSQL_SA_PASSWORD}
      JWT_SECRET: ${JWT_SECRET:?Configura JWT_SECRET en .env.docker}
      FRONTEND_URL: http://localhost:8080,http://localhost:5173
      PORT: 3000
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:?Configura GOOGLE_CLIENT_ID en .env.docker}
    ports:
      - "3000:3000"
    depends_on:
      database-init:
        condition: service_completed_successfully
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - fetch('http://localhost:3000/api').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: /api
    ports:
      - "8080:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  sqlserver_data:
